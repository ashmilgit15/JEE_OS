name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build without secrets
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Production smoke test without Supabase env
        run: |
          npm start > /tmp/jee-os-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsS -o /dev/null http://127.0.0.1:3000/api/questions
